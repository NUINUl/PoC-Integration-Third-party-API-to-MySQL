<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>External orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
            },
            colors: {
              ink: '#111827',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen antialiased" style="background-color: #f9fafb">
    <div class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
      <div class="rounded-xl bg-white p-6 shadow-sm sm:p-8">
        <header class="mb-6 flex flex-col gap-4 border-b border-gray-100 pb-6 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-xs font-medium uppercase tracking-wide text-gray-500">Integration</p>
            <h1 class="mt-1 text-2xl font-semibold tracking-tight text-ink sm:text-3xl">
              External orders
            </h1>
            <p class="mt-1 text-sm text-gray-500">
              Synced from <code class="rounded bg-gray-50 px-1.5 py-0.5 text-gray-700">/api/orders</code>
              · newest first
            </p>
          </div>
          <button
            id="refreshBtn"
            type="button"
            class="inline-flex shrink-0 items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
          >
            <svg
              class="h-4 w-4 shrink-0"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.75"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"
              />
            </svg>
            Refresh data
          </button>
        </header>

        <div
          id="status"
          class="mb-4 hidden rounded-lg border px-3 py-2 text-sm"
          role="status"
        ></div>

        <div id="tableSection" class="hidden overflow-hidden rounded-lg border border-gray-100 bg-white">
          <div class="overflow-x-auto">
            <table class="min-w-full border-collapse text-left text-sm">
              <thead class="bg-gray-50">
                <tr class="border-b border-gray-100">
                  <th scope="col" class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-gray-600 sm:px-5">
                    Order ID
                  </th>
                  <th scope="col" class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-gray-600 sm:px-5">
                    Customer
                  </th>
                  <th scope="col" class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-gray-600 sm:px-5">
                    Email
                  </th>
                  <th scope="col" class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-gray-600 sm:px-5">
                    Total
                  </th>
                  <th scope="col" class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-gray-600 sm:px-5">
                    Status
                  </th>
                  <th scope="col" class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-gray-600 sm:px-5">
                    Created
                  </th>
                </tr>
              </thead>
              <tbody id="tbody" class="divide-y divide-gray-100 text-gray-800"></tbody>
            </table>
          </div>
        </div>

        <div
          id="emptyState"
          class="hidden flex flex-col items-center justify-center rounded-lg border border-dashed border-gray-200 bg-gray-50/50 px-6 py-14 text-center"
        >
          <svg
            class="mb-3 h-10 w-10 text-gray-300"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"
            />
          </svg>
          <p class="text-sm font-medium text-gray-700">No orders yet</p>
          <p class="mt-1 max-w-sm text-xs text-gray-500">
            Send a POST to <code class="rounded bg-white px-1 text-gray-600">/api/webhook</code> to create your first
            record.
          </p>
        </div>
      </div>
    </div>

    <script>
      const tbody = document.getElementById('tbody');
      const statusEl = document.getElementById('status');
      const emptyState = document.getElementById('emptyState');
      const tableSection = document.getElementById('tableSection');
      const refreshBtn = document.getElementById('refreshBtn');

      function showStatus(message, kind) {
        statusEl.textContent = message;
        statusEl.classList.remove('hidden');
        statusEl.className =
          'mb-4 rounded-lg border px-3 py-2 text-sm ' +
          (kind === 'error'
            ? 'border-red-100 bg-red-50 text-red-800'
            : kind === 'warn'
              ? 'border-amber-100 bg-amber-50 text-amber-900'
              : 'border-emerald-100 bg-emerald-50 text-emerald-900');
      }

      function hideStatusSoon() {
        setTimeout(() => {
          statusEl.classList.add('hidden');
          statusEl.textContent = '';
        }, 3200);
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatMoney(n) {
        const x = Number(n);
        if (Number.isNaN(x)) return escapeHtml(n);
        return new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }).format(x);
      }

      function formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return escapeHtml(iso);
        return d.toLocaleString();
      }

      function renderRows(rows) {
        tbody.innerHTML = '';
        if (!rows.length) {
          tableSection.classList.add('hidden');
          emptyState.classList.remove('hidden');
          return;
        }
        emptyState.classList.add('hidden');
        tableSection.classList.remove('hidden');
        for (const r of rows) {
          const tr = document.createElement('tr');
          tr.className = 'border-b border-gray-100 bg-white last:border-0 hover:bg-gray-50/80';
          tr.innerHTML = `
            <td class="whitespace-nowrap px-4 py-3 font-mono text-xs text-gray-900 sm:px-5 sm:text-sm">${escapeHtml(r.order_id ?? '')}</td>
            <td class="px-4 py-3 text-gray-800 sm:px-5">${escapeHtml(r.customer_name ?? '')}</td>
            <td class="px-4 py-3 text-gray-600 sm:px-5">${escapeHtml(r.email ?? '')}</td>
            <td class="whitespace-nowrap px-4 py-3 text-gray-900 sm:px-5">${formatMoney(r.total_amount)}</td>
            <td class="px-4 py-3 sm:px-5">
              <span class="inline-flex rounded-md border border-gray-200 bg-white px-2 py-0.5 text-xs font-medium text-gray-700">${escapeHtml(r.status ?? '')}</span>
            </td>
            <td class="whitespace-nowrap px-4 py-3 text-gray-500 sm:px-5">${formatDate(r.created_at)}</td>
          `;
          tbody.appendChild(tr);
        }
      }

      async function loadOrders() {
        refreshBtn.disabled = true;
        statusEl.classList.add('hidden');
        try {
          const res = await fetch('/api/orders');
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            const msg = body.error || body.details || res.statusText;
            showStatus('Could not load orders: ' + msg, 'error');
            return;
          }
          const rows = Array.isArray(body) ? body : [];
          renderRows(rows);
          showStatus(rows.length + ' row(s) loaded.', 'ok');
          hideStatusSoon();
        } catch (e) {
          showStatus('Network error: ' + (e && e.message ? e.message : String(e)), 'error');
        } finally {
          refreshBtn.disabled = false;
        }
      }

      refreshBtn.addEventListener('click', loadOrders);
      loadOrders();
    </script>
  </body>
</html>
